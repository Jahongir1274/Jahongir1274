name: Generate Snake
 
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Jahongir1274
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFD93D&color_dots=#1a1423,#6a2c70,#b83b5e,#f08a5d,#f9ed69
            dist/github-contribution-grid-snake-light.svg?color_snake=#B83B5E&color_dots=#fff5e1,#ffd3b0,#ff9a76,#f08a5d,#b83b5e
 
      - name: Push snake svg
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
