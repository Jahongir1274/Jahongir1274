name: Generate Snake
 
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Jahongir1274
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#36BCF7&color_dots=#1a1a1a,#f9e94e,#f2cc0c,#e0b000,#c99700
            dist/github-contribution-grid-snake-dark.svg?color_snake=#36BCF7&color_dots=#1a1a1a,#f9e94e,#f2cc0c,#e0b000,#c99700
            dist/github-contribution-grid-snake-light.svg?color_snake=#0969DA&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
 
      - name: Push snake svg
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
