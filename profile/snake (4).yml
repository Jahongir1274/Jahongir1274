name: Generate Snake
 
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Jahongir1274
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFD43B&color_dots=#0d1117,#16324f,#204b78,#2e6ba1,#4B8BBE
            dist/github-contribution-grid-snake-light.svg?color_snake=#306998&color_dots=#fff9e6,#ffe873,#ffd43b,#f5c400,#e0a800
 
      - name: Push snake svg
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
